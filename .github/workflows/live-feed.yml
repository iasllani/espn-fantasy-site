name: Live Player Feed

# Deliberately separate from (and much lighter than) "Update ESPN Fantasy
# Data": this only needs fresh per-player box scores for the current week,
# so it skips the full 10-season history fetch and the career-long roast
# regeneration entirely. Runs a few times a week right after games wrap.

on:
  workflow_dispatch: {}
  schedule:
    # ~11:30pm ET on each game night. GitHub cron is UTC year-round, so the
    # local ET time drifts an hour at the DST change (04:00 UTC = 12:00am
    # EDT / 11:00pm EST) -- close enough either way for a post-game feed.
    - cron: "0 4 * * 5"        # Friday UTC: after Thursday night's games
    - cron: "0 4 * * 1"        # Monday UTC: after Sunday's games
    - cron: "0 4 * * 2"        # Tuesday UTC: after Monday night's game

permissions:
  contents: write

# Both this and update-data.yml commit to main; queue them so they can't
# race each other into a rejected push.
concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  live-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate live player feed
        env:
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_live_feed.py --league-id 703243

      - name: Commit updated feed
        run: |
          git config user.name "espn-data-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -f docs/data/live_feed.json ]; then git add docs/data/live_feed.json; fi
          git diff --cached --quiet || git commit -m "Update live feed ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git pull --rebase --autostash origin main
          git push
