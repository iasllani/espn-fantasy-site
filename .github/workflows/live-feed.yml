name: Live Player Feed

# Deliberately separate from (and much lighter than) "Update ESPN Fantasy
# Data": this only needs fresh per-player box scores for the current week,
# so it skips the full 10-season history fetch and the career-long roast
# regeneration entirely. Runs a few times a week right after games wrap.

on:
  workflow_dispatch: {}
  schedule:
    # Just after midnight ET on each game night, then a catch-up pass a few
    # hours later. The catch-up matters: night games often end ~11:45pm ET
    # (03:45 UTC), and ESPN takes a while to finalize stat corrections, so a
    # single early run can capture partial data -- and since the next game
    # night is days away, that partial snapshot would otherwise sit stale.
    # Each run recomputes the whole feed from scratch, so re-running is
    # harmless and self-healing.
    # (GitHub cron is UTC year-round; local ET drifts an hour at the DST
    # change. 04:30 UTC = 12:30am EDT / 11:30pm EST.)
    - cron: "30 4 * * 5"       # Friday UTC: after Thursday night's game
    - cron: "0 8 * * 5"        #   catch-up
    - cron: "30 4 * * 1"       # Monday UTC: after Sunday's games (incl. SNF)
    - cron: "0 8 * * 1"        #   catch-up
    - cron: "30 4 * * 2"       # Tuesday UTC: after Monday night's game
    - cron: "0 8 * * 2"        #   catch-up

permissions:
  contents: write

# Both this and update-data.yml commit to main; queue them so they can't
# race each other into a rejected push.
concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  live-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate live player feed
        env:
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_live_feed.py --league-id 703243

      - name: Commit updated feed
        run: |
          git config user.name "espn-data-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -f docs/data/live_feed.json ]; then git add docs/data/live_feed.json; fi
          git diff --cached --quiet || git commit -m "Update live feed ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git pull --rebase --autostash origin main
          git push
