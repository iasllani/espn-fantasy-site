name: Live Player Feed

# Deliberately separate from (and much lighter than) "Update ESPN Fantasy
# Data": this only needs fresh per-player box scores for the current week,
# so it skips the full 10-season history fetch and the career-long roast
# regeneration entirely. Runs a few times a week right after games wrap.

on:
  workflow_dispatch: {}
  schedule:
    # Daily, not just Thu/Sun/Mon: the NFL schedule is irregular (Wednesday
    # season openers, Friday/Saturday international games, late-season
    # Saturday slates), and hardcoding game nights silently misses those.
    # The 2026 opener was a Wednesday night game that a Thu/Sun/Mon schedule
    # would not have picked up until a day later.
    #
    # Two passes: just after midnight ET, then a catch-up a few hours later,
    # since night games often end ~11:45pm ET (03:45 UTC) and ESPN takes a
    # while to finalize stat corrections. The script no-ops (no AI spend)
    # when nothing has changed since the last run, so daily is cheap.
    # (GitHub cron is UTC year-round; local ET drifts an hour at the DST
    # change. 04:30 UTC = 12:30am EDT / 11:30pm EST.)
    - cron: "30 4 * * *"       # just after midnight ET
    - cron: "0 8 * * *"        # catch-up, for late finishes / stat corrections

permissions:
  contents: write

# Both this and update-data.yml commit to main; queue them so they can't
# race each other into a rejected push.
concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  live-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate live player feed
        env:
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_live_feed.py --league-id 703243

      - name: Commit updated feed
        run: |
          git config user.name "espn-data-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -f docs/data/live_feed.json ]; then git add docs/data/live_feed.json; fi
          git diff --cached --quiet || git commit -m "Update live feed ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git pull --rebase --autostash origin main
          git push
